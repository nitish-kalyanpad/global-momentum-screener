name: Run screener

# Manual only: open the Actions tab (or the GitHub mobile app), pick "Run screener", tap Run workflow.
on:
  workflow_dispatch:
    inputs:
      min_market_cap:
        description: "Minimum market cap in USD for results.csv (blank = no cutoff, e.g. 1e9)"
        required: false
        default: ""

permissions:
  contents: write  # to push the results to the gh-pages branch, which Pages serves

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run screener
        env:
          MIN_CAP: ${{ inputs.min_market_cap }}
        run: |
          if [ -n "$MIN_CAP" ]; then
            python screener.py --min-market-cap "$MIN_CAP"
          else
            python screener.py
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp results.html _site/index.html
          cp results.csv _site/results.csv
          touch _site/.nojekyll

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screen results"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
